[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexforge"
version = "1.0.0"
description = "Framework for reproducible radio dataset generation on SLICES-RI/CorteXlab"
readme = "README.md"
license = { file = "LICENSE" }

authors = [
  { name = "Andrea Joly", email = "andrea.joly@inria.fr" }
] 

requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Andreaj42/CorteXforge"
Repository = "https://github.com/Andreaj42/CorteXforge"
Issues = "https://github.com/Andreaj42/CorteXforge/issues"

[project.optional-dependencies]
planner = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2025.2",
  "PyYAML==6.0.3",
  "six==1.17.0",
  "tzdata==2025.2",
]
forge = [
  "sigmf==1.2.12"
]
dev = [
  "pytest==9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
cortexforge = "cortexforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cortexforge" = ["**/*.json"]
